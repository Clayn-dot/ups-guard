[mod-setting-description]
upq-cycle-hours=Игровое время между проходами. Проход разбит на маленькие шаги (одна поверхность, одна задача раз в полсекунды), поэтому рывка нет. Запустить вручную: /upq cycle
upq-announce=Выключите, чтобы заглушить все сообщения мода в чате (в лог они всё равно пишутся). Каждый игрок может скрыть их у себя: /upq messages off.
upq-extra-surfaces=Названия поверхностей через запятую. По умолчанию мод работает только с планетами и nauvis; чужие поверхности добавьте сюда. Космические платформы не трогаются никогда.
upq-protected-surfaces=Через запятую. Обрезка карты и удаление неиспользуемых или перечисленных поверхностей их пропускают.
upq-enemy-keep-surfaces=Через запятую. /upq enemies без названий поверхностей пропускает эти. Нужно там, где враги нужны, например для исследований.
upq-items-enabled=Убирает предметы, лежащие на земле. Предметы рядом с игроками, помеченные на разбор и из списка ниже остаются.
upq-items-radius=Предметы ближе этого расстояния к любому игроку на той же поверхности не убираются.
upq-items-surfaces=Названия через запятую. Пусто: все планеты.
upq-items-keep=Названия предметов через запятую, которые никогда не убираются с земли.
upq-trim-enabled=Удаляет сгенерированные чанки (вместе с гнёздами), которые далеко от ваших построек, радаров, артиллерии и игроков. Если туда вернуться, карта сгенерируется заново. По умолчанию выключено.
upq-trim-buffer=Сколько чанков (по 32 клетки) вокруг ваших построек и игроков не обрезается. 16 = 512 клеток. Зоны радаров и дальность артиллерии защищены целиком.
upq-trim-min-chunks=Если лишних чанков на поверхности меньше, она пропускается: карту не дёргают ради мелочи.
upq-trim-surfaces=Названия через запятую. Пусто: все планеты, кроме защищённых.
upq-delete-once=Через запятую. Каждая поверхность из списка удаляется один раз, когда на ней никого нет. Планета остаётся на звёздной карте и сгенерируется заново, если туда прилететь. Уберите имя из списка, чтобы потом можно было удалить её снова.
upq-delete-unused=В проходе обслуживания удаляет планеты, на которых столько времени (см. ниже) не было ни игроков, ни построек игроков. Космические платформы, nauvis и защищённые поверхности не удаляются никогда. Кандидатов можно посмотреть заранее: /upq surface unused.
upq-delete-unused-hours=Сколько игровых часов планета должна простоять пустой. Отсчёт начинается, когда настройка впервые используется.
upq-freeze-enabled=Враги дальше живой зоны от ваших построек ставятся на паузу и ничего не стоят в тик. Рядом с вами всё работает как обычно. Зоны пересчитываются каждые 10 минут. Выключите, чтобы разбудить всех.
upq-freeze-surfaces=Названия через запятую. Пусто: все планеты.
upq-freeze-radius=Враги ближе этого расстояния к любой вашей постройке живут обычной жизнью: нападают, расширяются, сборщики работают.
upq-freeze-wake-radius=Враги на паузе ближе этого расстояния к игроку просыпаются примерно за две секунды.
upq-thin-once=Один раз на поверхность удаляет вражеские объекты дальше радиуса прореживания от ваших построек. Ближние базы остаются. Берёт поверхности из настройки паузы.
upq-thin-radius=Базы ближе этого расстояния к вашим постройкам не прореживаются. Те, что между живой зоной и этой границей, остаются на паузе.
upq-sweep-prefixes=Через запятую. Раз в минуту вражеские юниты, у которых имя прототипа начинается с одного из этих префиксов, удаляются. Некоторые моды создают юнитов, которые должны сразу стать предметами; если они застревают, их копятся тысячи. Пример для Castra: data-collector-. Пусто: выключено.
upq-watch-enabled=В каждом проходе считает гнёзда и вражеских юнитов на всех планетах и предупреждает о тех, где превышены лимиты. Последние цифры: /upq status
upq-watch-spawners=Ориентир: 1000 гнёзд это примерно 4–5 тысяч юнитов, несколько миллисекунд в тик.
upq-watch-units=Ориентир: 5000 юнитов на планете стоят 3–4 миллисекунды в тик.
upq-watch-thin=При превышении лимитов запускает прореживание этой поверхности (как /upq thin). По умолчанию выключено.
upq-expansion-manage=Выставляет паузы между экспансиями врагов по значениям ниже. Действует на все поверхности сразу: в игре одна настройка. При выключении возвращаются прежние значения.
upq-expansion-min=В ванилле 4 минуты.
upq-expansion-max=В ванилле 60 минут.
upq-expansion-settlers=В ванилле 20.
upq-new-planet-enabled=Только для планет, которые создаются впервые. Уже существующие не меняются.
upq-new-planet-frequency=1 = без изменений. 0.8 = гнёзд на 20% меньше.
upq-new-planet-size=1 = без изменений. 0.9 = гнёзда на 10% меньше.
upq-new-planet-starting-area=Зона без врагов вокруг точки высадки. 1 = без изменений, 2 = вдвое больше.
upq-player-messages=Выключите, чтобы не видеть сообщения UPS Guard только у себя. То же, что /upq messages off.

[upq]
help-short=UPS Guard. /upq help покажет подкоманды.
help-header=Команды UPS Guard. К тем, что что-то удаляют, добавьте слово confirm; без него они только считают.
help-status=/upq status: счётчики, время до прохода, число врагов.
help-surfaces=/upq surfaces: поверхности с числом чанков и врагов.
help-config=/upq config [текст]: показать настройки (все или те, где есть текст).
help-messages=/upq messages [on|off]: показать или скрыть сообщения мода в чате у вас.
help-help=/upq help: этот список.
help-set=/upq set <настройка> <значение>: изменить настройку. Для списков: +имя добавляет, -имя убирает, - очищает.
help-reset=/upq reset <настройка>: вернуть одну настройку к умолчанию.
help-preset=/upq preset [имя]: применить набор настроек. Без имени покажет список.
help-cycle=/upq cycle: запустить проход обслуживания сейчас.
help-abort=/upq abort: отменить идущий проход и очередь задач.
help-report=/upq report: записать отчёт по сущностям в script-output/ups-quard-report.txt.
help-clean=/upq clean [поверхности] [confirm]: убрать предметы с земли.
help-sweep=/upq sweep: убрать застрявших юнитов по префиксам прямо сейчас.
help-trim=/upq trim <поверхность> [запас] [confirm]: удалить дальние пустые чанки.
help-freeze=/upq freeze [поверхности]: пересчитать зоны паузы сейчас.
help-thin=/upq thin [поверхности] confirm: удалить базы врагов дальше радиуса прореживания.
help-enemies=/upq enemies artillery|near <клетки>|reset <гнёзда> [поверхности] [confirm]: массовая зачистка врагов.
help-surface=/upq surface delete <имя> [confirm] | unused: удалить поверхность или показать простаивающие планеты.
unknown-command=Нет подкоманды "__1__". Смотрите /upq help.
admin-only=Эта подкоманда только для админов.
confirm-hint=Ничего не удалено. Добавьте слово confirm, чтобы выполнить.
