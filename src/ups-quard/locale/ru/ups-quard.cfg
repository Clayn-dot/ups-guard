upq-announce=Показывать сообщения мода в чате
upq-extra-surfaces=Дополнительные поверхности, которые считать планетами
upq-protected-surfaces=Поверхности, которые не обрезать и не удалять
upq-enemy-keep-surfaces=Поверхности, где массовая зачистка врагов пропускается
upq-items-enabled=Убирать предметы с земли
upq-items-radius=Предметы: не трогать ближе к игроку (клетки)
upq-items-surfaces=Предметы: только на этих поверхностях
upq-items-keep=Предметы: никогда не убирать эти
upq-trim-enabled=Обрезать дальнюю пустую карту
upq-trim-buffer=Обрезка: запас вокруг построек (чанки)
upq-trim-min-chunks=Обрезка: действовать, только если свободно не меньше чанков
upq-trim-surfaces=Обрезка: только на этих поверхностях
upq-delete-once=Удалить эти поверхности один раз
upq-delete-unused=Удалять неиспользуемые планеты
upq-delete-unused-hours=Неиспользуемые планеты: простой не меньше (часов)
upq-freeze-enabled=Ставить на паузу дальние базы врагов
upq-freeze-surfaces=Пауза: только на этих поверхностях
upq-freeze-radius=Пауза: живая зона вокруг ваших построек (клетки)
upq-freeze-wake-radius=Пауза: будить врагов ближе этого расстояния к игроку (клетки)
upq-thin-once=Один раз проредить дальние базы врагов
upq-thin-radius=Прореживание: оставить базы ближе (клетки)
upq-sweep-prefixes=Убирать застрявших вражеских юнитов с такими префиксами имени
upq-watch-enabled=Считать гнёзда и вражеских юнитов
upq-watch-spawners=Предупреждать, если гнёзд на поверхности больше
upq-watch-units=Предупреждать, если вражеских юнитов на поверхности больше
upq-watch-thin=Прореживать дальние базы при превышении лимита
upq-expansion-manage=Управлять экспансией врагов
upq-expansion-min=Экспансия: самая короткая пауза (минуты)
upq-expansion-max=Экспансия: самая длинная пауза (минуты)
upq-expansion-settlers=Экспансия: максимум поселенцев в отряде
upq-new-planet-enabled=Настраивать врагов на новых планетах
upq-new-planet-frequency=Новые планеты: частота гнёзд (множитель)
upq-new-planet-size=Новые планеты: размер гнёзд (множитель)
upq-new-planet-starting-area=Новые планеты: безопасная стартовая зона (множитель)
