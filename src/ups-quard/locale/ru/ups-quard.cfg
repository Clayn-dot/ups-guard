[mod-name]
ups-quard=UPS Guard

[mod-description]
ups-quard=Держит тяжёлую карту для мультиплеера быстрой. Раз в несколько часов убирает предметы с земли, обрезает дальнюю пустую карту, удаляет неиспользуемые планеты и считает гнёзда. Ставит на паузу дальние базы врагов, управляет экспансией, настраивает новые планеты. Всё отключаемо и настраивается в настройках мода или командой /upq.

