[mod-name]
ups-quard=UPS Guard

[mod-description]
ups-quard=Keeps a heavy multiplayer save fast. A maintenance pass every few hours removes items from the ground, trims far empty map, deletes unused planets and counts nests. Pauses far enemy bases, paces expansion, tunes new planets. Everything is optional and set in the mod settings or with the /upq command.

[mod-setting-name]
upq-cycle-hours=Maintenance pass every (hours)
upq-announce=Show mod messages in chat
upq-extra-surfaces=Extra surfaces to treat as planets
upq-protected-surfaces=Surfaces never trimmed or deleted
upq-enemy-keep-surfaces=Surfaces where bulk enemy removal is skipped
upq-items-enabled=Remove items from the ground
upq-items-radius=Items: keep those closer to a player than (tiles)
upq-items-surfaces=Items: only on these surfaces
upq-items-keep=Items: never remove these
upq-trim-enabled=Trim far empty map
upq-trim-buffer=Trim: margin around your buildings (chunks)
upq-trim-min-chunks=Trim: act only if at least this many chunks are free
upq-trim-surfaces=Trim: only on these surfaces
upq-delete-once=Delete these surfaces once
upq-delete-unused=Delete unused planets
upq-delete-unused-hours=Unused planets: idle for at least (hours)
upq-freeze-enabled=Pause far enemy bases
upq-freeze-surfaces=Pause: only on these surfaces
upq-freeze-radius=Pause: live zone around your buildings (tiles)
upq-freeze-wake-radius=Pause: wake enemies this close to a player (tiles)
upq-thin-once=Thin far enemy bases once
upq-thin-radius=Thin: keep bases closer than (tiles)
upq-sweep-prefixes=Remove stuck enemy units with these name prefixes
upq-watch-enabled=Count nests and enemy units
upq-watch-spawners=Warn when a surface has more nests than
upq-watch-units=Warn when a surface has more enemy units than
upq-watch-thin=Thin far enemy bases when a limit is passed
upq-expansion-manage=Manage enemy expansion
upq-expansion-min=Expansion: shortest pause (minutes)
upq-expansion-max=Expansion: longest pause (minutes)
upq-expansion-settlers=Expansion: most settlers in a group
upq-new-planet-enabled=Tune enemies on new planets
upq-new-planet-frequency=New planets: nest frequency (multiplier)
upq-new-planet-size=New planets: nest size (multiplier)
upq-new-planet-starting-area=New planets: safe starting area (multiplier)
upq-player-messages=Show UPS Guard messages for me

[mod-setting-description]
upq-cycle-hours=Game time between maintenance passes. A pass is split into small steps (one surface, one task every half second), so there is no freeze. Start one by hand: /upq cycle
upq-announce=Turn off to silence all chat messages of the mod (they still go to the log). Each player can also hide them with /upq messages off.
upq-extra-surfaces=Comma separated surface names. By default the mod works on planets and nauvis only; list other surfaces here to include them. Space platforms are never touched.
upq-protected-surfaces=Comma separated. Map trimming and deletion of unused or listed surfaces skip these.
upq-enemy-keep-surfaces=Comma separated. /upq enemies without surface names skips these. Use it where enemy bases are needed, for example for research.
upq-items-enabled=Removes items lying on the ground. Items near players, marked for deconstruction, or listed below stay.
upq-items-radius=Items closer than this to any player on the same surface are not removed.
upq-items-surfaces=Comma separated surface names. Empty means every planet.
upq-items-keep=Comma separated item names that are never removed from the ground.
upq-trim-enabled=Deletes generated chunks (with the nests on them) that are far from everything you built, from radars, artillery and players. If someone comes back there, the map is generated again. Off by default.
upq-trim-buffer=Chunks (32 tiles each) around your buildings and players that are never trimmed. 16 means 512 tiles. Radar scan areas and artillery reach are protected in full.
upq-trim-min-chunks=A surface with fewer chunks to remove is skipped, so the map is not touched for small gains.
upq-trim-surfaces=Comma separated surface names. Empty means every planet that is not protected.
upq-delete-once=Comma separated. Each listed surface is deleted once, when nobody is on it. The planet stays on the star map and is generated again if someone travels there. Remove a name from the list to allow deleting it again later.
upq-delete-unused=In the maintenance pass, deletes planets that have had no players and no buildings of any player force for the time below. Space platforms, nauvis and protected surfaces are never deleted. Check the candidates first with /upq surface unused.
upq-delete-unused-hours=Game hours a planet must stay empty. The count starts when the setting is first used.
upq-freeze-enabled=Enemy entities beyond the live zone from your buildings are paused and cost nothing per tick. Near you everything works as usual. Zones are recalculated every 10 minutes. Turn off to wake everything again.
upq-freeze-surfaces=Comma separated surface names. Empty means every planet.
upq-freeze-radius=Enemies closer than this to any of your buildings live normally: they attack, expand, collectors work.
upq-freeze-wake-radius=Paused enemies within this distance of a player are woken within about two seconds.
upq-thin-once=Once per surface, deletes enemy entities beyond the thin radius from your buildings. Nearer bases stay. Uses the surfaces of the pause setting.
upq-thin-radius=Bases closer than this to your buildings are never thinned. Those between the live zone and this distance stay paused.
upq-sweep-prefixes=Comma separated. Once a minute, enemy units whose prototype name starts with one of these are removed. Some mods spawn units that should turn into items at once; when they get stuck they pile up. Example for Castra: data-collector-. Empty means off.
upq-watch-enabled=In each pass, counts nests and enemy units on every planet and warns about planets over the limits. Last numbers: /upq status
upq-watch-spawners=About 1000 nests is roughly 4000 to 5000 units, a few milliseconds per tick.
upq-watch-units=About 5000 units on a planet cost 3 to 4 milliseconds per tick.
upq-watch-thin=When the limits are passed, starts a thinning of that surface (same as /upq thin). Off by default.
upq-expansion-manage=Sets the pauses between enemy expansions from the values below. Works on all surfaces at once, as the game has one setting. When turned off, the values from before are restored.
upq-expansion-min=Vanilla is 4 minutes.
upq-expansion-max=Vanilla is 60 minutes.
upq-expansion-settlers=Vanilla is 20.
upq-new-planet-enabled=Only for planets generated for the first time. Existing planets stay as they are.
upq-new-planet-frequency=1 means unchanged. 0.8 means 20 percent fewer nests.
upq-new-planet-size=1 means unchanged. 0.9 means 10 percent smaller nests.
upq-new-planet-starting-area=Enemy-free area around the landing point. 1 means unchanged, 2 means twice as big.
upq-player-messages=Turn off to stop UPS Guard chat messages for you only. Same as /upq messages off.

[upq]
help-short=UPS Guard. /upq help lists the subcommands.
help-header=UPS Guard commands. Add "confirm" to the ones that remove things; without it they only count.
help-status=/upq status: counters, next pass, enemy counts.
help-surfaces=/upq surfaces: surfaces with chunk and enemy counts.
help-config=/upq config [text]: show settings (all, or those that contain the text).
help-messages=/upq messages [on|off]: show or hide the mod's chat messages for you.
help-help=/upq help: this list.
help-set=/upq set <setting> <value>: change a setting. For lists: +name adds, -name removes, - clears.
help-reset=/upq reset <setting>: put one setting back to its default.
help-preset=/upq preset [name]: apply a set of settings. Without a name it lists them.
help-cycle=/upq cycle: start the maintenance pass now.
help-abort=/upq abort: cancel the running pass and the queued jobs.
help-report=/upq report: write an entity report to script-output/ups-quard-report.txt.
help-clean=/upq clean [surfaces] [confirm]: remove items from the ground.
help-sweep=/upq sweep: remove stuck units by the prefixes setting now.
help-trim=/upq trim <surface> [margin] [confirm]: delete far empty chunks.
help-freeze=/upq freeze [surfaces]: recalculate paused enemy zones now.
help-thin=/upq thin [surfaces] confirm: delete enemy bases beyond the thin radius.
help-enemies=/upq enemies artillery|near <tiles>|reset <nests> [surfaces] [confirm]: bulk enemy removal.
help-surface=/upq surface delete <name> [confirm] | unused: delete a surface, or list idle planets.
