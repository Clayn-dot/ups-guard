help-junk=/upg junk [surfaces] [confirm]: remove fire and remnants (types from the junk setting).
help-pollution=/upg pollution [surfaces] [confirm]: show pollution, clear it on empty planets (or on named ones).
help-platforms=/upg platforms [confirm]: asteroids around each platform, trim them to the limit.
help-trains=/upg trains: trains that cannot find a path.
help-profile=/upg profile [on|off]: show the time spent per job in the pass card.
help-short=UPS Guard. /upg help lists the subcommands.
help-header=UPS Guard commands. Add "confirm" to the ones that remove things; without it they only count.
