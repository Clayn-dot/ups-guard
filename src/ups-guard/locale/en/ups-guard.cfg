[mod-setting-description]
upg-cycle-hours=Game time between maintenance passes. A pass is split into small steps (one surface, one task every half second), so there is no freeze. Start one by hand: /upg cycle
upg-announce=Turn off to silence all chat messages of the mod (they still go to the log). Each player can also hide them with /upg messages off.
upg-extra-surfaces=Comma separated surface names. By default the mod works on planets and nauvis only; list other surfaces here to include them. Space platforms are never touched.
upg-protected-surfaces=Comma separated. Map trimming and deletion of unused or listed surfaces skip these.
upg-enemy-keep-surfaces=Comma separated. /upg enemies without surface names skips these. Use it where enemy bases are needed, for example for research.
upg-items-enabled=Removes items lying on the ground. Items near players, marked for deconstruction, or listed below stay.
upg-items-radius=Items closer than this to any player on the same surface are not removed.
upg-items-surfaces=Comma separated surface names. Empty means every planet.
upg-items-keep=Comma separated item names that are never removed from the ground.
upg-trim-enabled=Deletes generated chunks (with the nests on them) that are far from everything you built, from radars, artillery and players. If someone comes back there, the map is generated again. On from the Minimal level. Effect on play: none, as long as the margin is large.
upg-trim-buffer=Chunks (32 tiles each) around your buildings and players that are never trimmed. 24 means 768 tiles. Radar scan areas and artillery reach are protected in full.
upg-trim-min-chunks=A surface with fewer chunks to remove is skipped, so the map is not touched for small gains.
upg-trim-surfaces=Comma separated surface names. Empty means every planet that is not protected.
upg-delete-once=Comma separated. Each listed surface is deleted once, when nobody is on it. The planet stays on the star map and is generated again if someone travels there. Remove a name from the list to allow deleting it again later.
upg-delete-fresh=In the maintenance pass, deletes planets where nobody ever stood or built (for example, only a space platform flew by). Nothing of the players is lost. A platform parked in orbit keeps the planet alive. The planet is generated again if someone travels there. Effect on play: none.
upg-delete-fresh-hours=Game hours with nobody there (counted from when a platform left orbit, or from when the mod first saw the planet). Checked once per maintenance pass.
upg-delete-unused=In the maintenance pass, deletes planets that were used before (a player or a building was there) and have been empty for the time below. Enemy evolution of that planet starts over and the map is generated again if someone returns. Space platforms, nauvis and protected surfaces are never deleted. A warning goes to chat at half the time and before the last pass. Check the candidates with /upg surface unused. Effect on play: makes the game easier (evolution on that planet resets).
upg-delete-unused-hours=Game hours a used planet must stay empty. The count restarts whenever a player or a building is there. Checked once per maintenance pass.
upg-freeze-enabled=Enemy entities beyond the live zone from your buildings are paused and cost nothing per tick. Near you everything works as usual. Zones are recalculated every 10 minutes. Turn off to wake everything again. Effect on play: makes the game easier.
upg-freeze-surfaces=Comma separated surface names. Empty means every planet.
upg-freeze-radius=Enemies closer than this to any of your buildings live normally: they attack, expand, collectors work.
upg-freeze-wake-radius=Paused enemies within this distance of a player are woken within about two seconds.
upg-thin-once=Once per surface, deletes enemy entities beyond the thin radius from your buildings. Nearer bases stay. Works on the surfaces listed in the setting above. Effect on play: makes the game easier.
upg-thin-radius=Bases closer than this to your buildings are never thinned. Those between the live zone and this distance stay paused.
upg-sweep-prefixes=Comma separated. Once a minute, enemy units whose prototype name starts with one of these are removed. Some mods spawn units that should turn into items at once; when they get stuck they pile up. Example: data-collector-. Empty means off.
upg-watch-enabled=In each pass, counts nests and enemy units on every planet and warns about planets over the limits. Last numbers: /upg status
upg-watch-spawners=About 1000 nests is roughly 4000 to 5000 units, a few milliseconds per tick.
upg-watch-units=About 5000 units on a planet cost 3 to 4 milliseconds per tick.
upg-watch-thin=When the limits are passed, starts a thinning of that surface (same as /upg thin). On from the High level. Effect on play: makes the game easier.
upg-expansion-manage=Sets the pauses between enemy expansions from the values below. Works on all surfaces at once, as the game has one setting. When turned off, the values from before are restored. Effect on play: makes the game easier.
upg-expansion-min=Vanilla is 4 minutes.
upg-expansion-max=Vanilla is 60 minutes.
upg-expansion-settlers=Vanilla is 20.
upg-new-planet-enabled=Only for planets generated for the first time. Existing planets stay as they are. Effect on play: makes the game easier.
upg-new-planet-frequency=1 means unchanged. 0.8 means 20 percent fewer nests.
upg-new-planet-size=1 means unchanged. 0.9 means 10 percent smaller nests.
upg-new-planet-starting-area=Enemy-free area around the landing point. 1 means unchanged, 2 means twice as big.
upg-level=Minimal: only what players do not notice (ground items, trimming of far empty map, planets nobody ever used, the enemy count). Medium: a bit more, still hardly felt (far enemy bases paused with a wide live zone, fire and remnants removed, pollution cleared on planets with no nests, slightly slower expansion and lighter enemy pathfinding). High: stronger values, plus automatic thinning, deleting planets that were used and left empty for a day, slower pollution spreading, an asteroid limit around platforms. Extreme: UPS over comfort. Everything at its strongest, pollution cleared even where enemies live, fewer asteroids spawn, robots build slower. The game stays playable. Choosing a level writes its settings once; you can still change any of them, and Custom writes nothing. See what a level changes: /upg preset <name>. Check with /upg status.
upg-calm-players=While at least this many players are online, the maintenance pass works three times slower. 0 means it always works at normal speed.
upg-junk-enabled=In each pass removes the junk types listed below, except near players.
upg-junk-types=Comma separated. Allowed: fire, corpse (remnants and corpses), entity-ghost (ghosts of buildings, off by default because players may still want them). Other names are ignored.
upg-junk-surfaces=Comma separated surface names. Empty means every planet.
upg-thin-surfaces=Comma separated surface names that the one-time thinning works on.
upg-trains-watch=In each pass counts trains that cannot find a path. They ask for a path again and again and cost UPS on a big rail network. The list: /upg trains
upg-trains-limit=A warning appears in chat when more trains than this are stuck.
upg-ai-tune=Lowers how much work the game spends on enemy pathfinding and how many attack groups gather at once. Enemies may need longer to reach you. The old values come back when this is turned off. Effect on play: makes the game easier.
upg-ai-path-percent=100 means unchanged. 50 means half of the pathfinding work per tick.
upg-ai-groups-percent=100 means unchanged. 50 means half as many groups gathering, and half the group size.
upg-pollution-tune=Chunks start spreading pollution only when they hold more of it. Pollution travels less far, so there are fewer chunks to update. The old value comes back when this is turned off. Effect on play: makes the game a little easier (fewer attacks from far away).
upg-pollution-diffuse-percent=100 means unchanged. 400 means a chunk needs four times as much pollution before it spreads.
upg-pollution-clear-quiet=In every maintenance pass, clears all pollution on planets that have no enemy nests, whether or not a player is there. Nothing can use that pollution. Surfaces of other mods are only touched if they are planets or listed as extra surfaces and are not protected. Effect on play: none.
upg-pollution-clear=Also clears pollution on planets that do have nests, once no player has been there for the time below. Buildings of players do not count as a visit. Effect on play: makes the game easier (nests there get no pollution to attack with).
upg-pollution-clear-hours=Game hours without any player on a planet that has nests.
upg-pollution-surfaces=Comma separated surface names. Empty means every planet.
upg-asteroids-tune=Changes how fast asteroids appear in space. The old value comes back when this is turned off. Effect on play: slows players (fewer asteroids to mine).
upg-asteroids-percent=100 means unchanged. 50 means half as many.
upg-asteroids-cap=When more asteroids than this are around a platform, the farthest from its hub are removed in each pass. Platforms themselves are never touched. See also /upg platforms Effect on play: slows players a little when it is set low.
upg-build-queue-tune=Lowers how many ghosts the construction robots of each force try to build per tick. Building is a little slower, big blueprints cost less. The old value comes back when this is turned off. Effect on play: slows players.
upg-build-queue-percent=100 means unchanged. 67 means two thirds.
upg-player-messages=Turn off to stop UPS Guard chat messages for you only. Same as /upg messages off.

