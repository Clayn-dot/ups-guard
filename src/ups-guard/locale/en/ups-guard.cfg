help-help=/upg help: this list.
help-set=/upg set <setting> <value>: change a setting. For lists: +name adds, -name removes, - clears.
help-reset=/upg reset <setting>: put one setting back to its default.
help-preset=/upg preset [name]: apply a set of settings. Without a name it lists them.
help-cycle=/upg cycle: start the maintenance pass now.
help-abort=/upg abort: cancel the running pass and the queued jobs.
help-report=/upg report: write an entity report to script-output/ups-guard-report.txt.
help-clean=/upg clean [surfaces] [confirm]: remove items from the ground.
help-sweep=/upg sweep: remove stuck units by the prefixes setting now.
help-trim=/upg trim <surface> [margin] [confirm]: delete far empty chunks.
help-freeze=/upg freeze [surfaces]: recalculate paused enemy zones now.
help-thin=/upg thin [surfaces] confirm: delete enemy bases beyond the thin radius.
help-enemies=/upg enemies artillery|near <tiles>|reset <nests> [surfaces] [confirm]: bulk enemy removal.
help-surface=/upg surface delete <name> [confirm] | unused: delete a surface, or list idle planets.
