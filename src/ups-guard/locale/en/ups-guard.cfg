[mod-name]
ups-guard=UPS Guard

[mod-description]
ups-guard=Keeps a heavy multiplayer save fast. Pick an effect level (minimal, medium, high, extreme) in the settings. A maintenance pass every few hours removes items, fire and remnants, trims far empty map, deletes planets nobody uses, clears pollution, caps asteroids around platforms and counts nests and stuck trains. Pauses far enemy bases, paces expansion, lowers enemy pathfinding. Commands: /upg help.

