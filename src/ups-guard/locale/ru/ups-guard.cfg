[mod-name]
ups-guard=UPS Guard

[mod-description]
ups-guard=Держит тяжёлое мультиплеерное сохранение быстрым. В настройках выберите уровень воздействия (минимальный, средний, высокий). Проход обслуживания раз в несколько часов убирает предметы, огонь и обломки, обрезает пустую карту, удаляет ничьи планеты, очищает загрязнение на пустых планетах, ограничивает астероиды у платформ и считает гнёзда и застрявшие поезда. Ставит на паузу дальние базы врагов, замедляет экспансию, облегчает поиск пути врагов. Команды: /upq help.

