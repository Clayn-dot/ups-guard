help-junk=/upg junk [поверхности] [confirm]: убрать огонь и обломки (типы из настройки мусора).
help-pollution=/upg pollution [поверхности] [confirm]: показать загрязнение, очистить на пустых планетах (или на названных).
help-platforms=/upg platforms [confirm]: астероиды у каждой платформы, убрать лишние сверх предела.
help-trains=/upg trains: поезда, которые не могут найти путь.
help-profile=/upg profile [on|off]: показывать время по задачам в карточке прохода.
help-short=UPS Guard. /upg help покажет подкоманды.
help-header=Команды UPS Guard. К тем, что что-то удаляют, добавьте слово confirm; без него они только считают.
help-status=/upg status: счётчики, время до прохода, число врагов.
help-surfaces=/upg surfaces: поверхности с числом чанков и врагов.
help-config=/upg config [текст]: показать настройки (все или те, где есть текст).
help-messages=/upg messages [on|off]: показать или скрыть сообщения мода в чате у вас.
help-help=/upg help: этот список.
help-set=/upg set <настройка> <значение>: изменить настройку. Для списков: +имя добавляет, -имя убирает, - очищает.
help-reset=/upg reset <настройка>: вернуть одну настройку к умолчанию.
help-preset=/upg preset [имя] [confirm]: без confirm покажет, что изменит набор, с ним применит. Без имени покажет список.
help-cycle=/upg cycle: запустить проход обслуживания сейчас.
help-abort=/upg abort: отменить идущий проход и очередь задач.
help-report=/upg report: записать отчёт по сущностям в script-output/ups-guard-report.txt.
help-clean=/upg clean [поверхности] [confirm]: убрать предметы с земли.
help-sweep=/upg sweep: убрать застрявших юнитов по префиксам прямо сейчас.
help-trim=/upg trim <поверхность> [запас] [confirm]: удалить дальние пустые чанки.
help-freeze=/upg freeze [поверхности]: пересчитать зоны паузы сейчас.
help-thin=/upg thin [поверхности] confirm: удалить базы врагов дальше радиуса прореживания.
help-enemies=/upg enemies artillery|near <клетки>|reset <гнёзда> [поверхности] [confirm]: массовая зачистка врагов.
help-surface=/upg surface delete <имя> [confirm] | unused: удалить поверхность или показать планеты и когда их удалят.
