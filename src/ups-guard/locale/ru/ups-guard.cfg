[mod-setting-description]
upg-cycle-hours=Игровое время между проходами. Проход разбит на маленькие шаги (одна поверхность, одна задача раз в полсекунды), поэтому рывка нет. Запустить вручную: /upg cycle
upg-announce=Выключите, чтобы заглушить все сообщения мода в чате (в лог они всё равно пишутся). Каждый игрок может скрыть их у себя: /upg messages off.
upg-extra-surfaces=Названия поверхностей через запятую. По умолчанию мод работает только с планетами и nauvis; чужие поверхности добавьте сюда. Космические платформы не трогаются никогда.
upg-protected-surfaces=Через запятую. Обрезка карты и удаление неиспользуемых или перечисленных поверхностей их пропускают.
upg-enemy-keep-surfaces=Через запятую. /upg enemies без названий поверхностей пропускает эти. Нужно там, где враги нужны, например для исследований.
upg-items-enabled=Убирает предметы, лежащие на земле. Предметы рядом с игроками, помеченные на разбор и из списка ниже остаются.
upg-items-radius=Предметы ближе этого расстояния к любому игроку на той же поверхности не убираются.
upg-items-surfaces=Названия через запятую. Пусто: все планеты.
upg-items-keep=Названия предметов через запятую, которые никогда не убираются с земли.
upg-trim-enabled=Удаляет сгенерированные чанки (вместе с гнёздами), которые далеко от ваших построек, радаров, артиллерии и игроков. Если туда вернуться, карта сгенерируется заново. Включено с минимального уровня. Влияние на игру: нет, пока запас большой.
upg-trim-buffer=Сколько чанков (по 32 клетки) вокруг ваших построек и игроков не обрезается. 24 = 768 клеток. Зоны радаров и дальность артиллерии защищены целиком.
upg-trim-min-chunks=Если лишних чанков на поверхности меньше, она пропускается: карту не дёргают ради мелочи.
upg-trim-surfaces=Названия через запятую. Пусто: все планеты, кроме защищённых.
upg-delete-once=Через запятую. Каждая поверхность из списка удаляется один раз, когда на ней никого нет. Планета остаётся на звёздной карте и сгенерируется заново, если туда прилететь. Уберите имя из списка, чтобы потом можно было удалить её снова.
upg-delete-fresh=В проходе обслуживания удаляет планеты, где никто никогда не стоял и ничего не строил (например, мимо пролетела только космическая платформа). Ничего из сделанного игроками не пропадает. Платформа на орбите сохраняет планету. Если туда прилететь, планета сгенерируется заново. Влияние на игру: нет.
upg-delete-fresh-hours=Игровых часов, пока там никого нет (счёт идёт с того момента, как платформа улетела с орбиты, или с первого раза, когда мод увидел планету). Проверяется раз в проход обслуживания.
upg-delete-unused=В проходе обслуживания удаляет планеты, которыми раньше пользовались (там были игрок или постройка) и которые простояли пустыми столько времени, сколько указано ниже. Эволюция врагов на этой планете начнётся заново, а карта сгенерируется снова, если туда вернуться. Космические платформы, nauvis и защищённые поверхности не удаляются никогда. В чат придёт предупреждение на половине срока и перед последним проходом. Кандидатов можно посмотреть заранее: /upg surface unused. Влияние на игру: игра становится легче (эволюция на этой планете сбрасывается).
upg-delete-unused-hours=Сколько игровых часов использованная планета должна простоять пустой. Отсчёт начинается заново, когда там появляется игрок или постройка. Проверяется раз в проход обслуживания.
upg-freeze-enabled=Враги дальше живой зоны от ваших построек ставятся на паузу и ничего не стоят в тик. Рядом с вами всё работает как обычно. Зоны пересчитываются каждые 10 минут. Выключите, чтобы разбудить всех. Влияние на игру: игра становится легче.
upg-freeze-surfaces=Названия через запятую. Пусто: все планеты.
upg-freeze-radius=Враги ближе этого расстояния к любой вашей постройке живут обычной жизнью: нападают, расширяются, сборщики работают.
upg-freeze-wake-radius=Враги на паузе ближе этого расстояния к игроку просыпаются примерно за две секунды.
upg-thin-once=Один раз на поверхность удаляет вражеские объекты дальше радиуса прореживания от ваших построек. Ближние базы остаются. Работает на поверхностях из настройки выше. Влияние на игру: игра становится легче.
upg-thin-radius=Базы ближе этого расстояния к вашим постройкам не прореживаются. Те, что между живой зоной и этой границей, остаются на паузе.
upg-sweep-prefixes=Через запятую. Раз в минуту вражеские юниты, у которых имя прототипа начинается с одного из этих префиксов, удаляются. Некоторые моды создают юнитов, которые должны сразу стать предметами; если они застревают, их копятся тысячи. Пример: data-collector-. Пусто: выключено.
upg-watch-enabled=В каждом проходе считает гнёзда и вражеских юнитов на всех планетах и предупреждает о тех, где превышены лимиты. Последние цифры: /upg status
upg-watch-spawners=Ориентир: 1000 гнёзд это примерно 4–5 тысяч юнитов, несколько миллисекунд в тик.
upg-watch-units=Ориентир: 5000 юнитов на планете стоят 3–4 миллисекунды в тик.
upg-watch-thin=При превышении лимитов запускает прореживание этой поверхности (как /upg thin). Включено с высокого уровня. Влияние на игру: игра становится легче.
upg-expansion-manage=Выставляет паузы между экспансиями врагов по значениям ниже. Действует на все поверхности сразу: в игре одна настройка. При выключении возвращаются прежние значения. Влияние на игру: игра становится легче.
upg-expansion-min=В ванилле 4 минуты.
upg-expansion-max=В ванилле 60 минут.
upg-expansion-settlers=В ванилле 20.
upg-new-planet-enabled=Только для планет, которые создаются впервые. Уже существующие не меняются. Влияние на игру: игра становится легче.
upg-new-planet-frequency=1 = без изменений. 0.8 = гнёзд на 20% меньше.
upg-new-planet-size=1 = без изменений. 0.9 = гнёзда на 10% меньше.
upg-new-planet-starting-area=Зона без врагов вокруг точки высадки. 1 = без изменений, 2 = вдвое больше.
upg-level=Минимальный: только то, чего игроки не замечают (предметы на земле, обрезка далёкой пустой карты, планеты, которыми никто не пользовался, счёт врагов). Средний: чуть больше, всё ещё почти незаметно (дальние базы врагов на паузе с широкой живой зоной, убираются огонь и обломки, очищается загрязнение на планетах без гнёзд, экспансия чуть медленнее и поиск пути у врагов легче). Высокий: значения сильнее, плюс автоматическое прореживание, удаление планет, которыми пользовались и оставили пустыми на сутки, медленнее растекание загрязнения, предел астероидов у платформ. Экстремальный: UPS важнее комфорта. Всё на максимуме, загрязнение очищается даже там, где живут враги, астероидов появляется меньше, роботы строят медленнее. Играть всё равно можно. Выбор уровня один раз записывает его настройки; любую из них потом можно поменять, а «Свой» ничего не записывает. Что меняет уровень: /upg preset <имя>. Проверка: /upg status.
upg-calm-players=Пока онлайн не меньше столько игроков, проход обслуживания идёт втрое медленнее. 0 — всегда с обычной скоростью.
upg-junk-enabled=В каждом проходе убирает типы мусора из списка ниже, кроме тех, что рядом с игроками.
upg-junk-types=Через запятую. Разрешены: fire (огонь), corpse (обломки и трупы), entity-ghost (призраки построек, по умолчанию не включены, игрокам они могут быть нужны). Остальные названия игнорируются.
upg-junk-surfaces=Названия поверхностей через запятую. Пусто — все планеты.
upg-thin-surfaces=Названия поверхностей через запятую, на которых работает разовое прореживание.
upg-trains-watch=В каждом проходе считает поезда, которые не могут найти путь. Они снова и снова запрашивают путь и ест UPS на большой железной дороге. Список: /upg trains
upg-trains-limit=В чат придёт предупреждение, когда застрявших поездов больше этого числа.
upg-ai-tune=Снижает, сколько игра тратит на поиск пути врагов и сколько атакующих групп собирается одновременно. Врагам может понадобиться больше времени, чтобы дойти до вас. Старые значения вернутся при выключении. Влияние на игру: игра становится легче.
upg-ai-path-percent=100 — без изменений. 50 — вдвое меньше работы над поиском пути за тик.
upg-ai-groups-percent=100 — без изменений. 50 — вдвое меньше собирающихся групп и вдвое меньший размер группы.
upg-pollution-tune=Чанк начинает распространять загрязнение, только когда его там больше. Загрязнение уходит не так далеко, обновлять нужно меньше чанков. Старое значение вернётся при выключении. Влияние на игру: игра становится чуть легче (меньше атак издалека).
upg-pollution-diffuse-percent=100 — без изменений. 400 — чанку нужно вчетверо больше загрязнения, чтобы оно растекалось.
upg-pollution-clear-quiet=В каждом проходе обслуживания очищает всё загрязнение на планетах, где нет вражеских гнёзд, есть там игрок или нет. Использовать это загрязнение некому. Поверхности других модов затрагиваются, только если это планеты или они указаны как дополнительные и не защищены. Влияние на игру: нет.
upg-pollution-clear=Очищает загрязнение и на планетах, где гнёзда есть, когда там не было ни одного игрока столько времени, сколько указано ниже. Постройки игроков посещением не считаются. Влияние на игру: игра становится легче (гнёздам там нечем атаковать).
upg-pollution-clear-hours=Игровых часов без единого игрока на планете, где есть гнёзда.
upg-pollution-surfaces=Названия поверхностей через запятую. Пусто — все планеты.
upg-asteroids-tune=Меняет, как быстро в космосе появляются астероиды. Старое значение вернётся при выключении. Влияние на игру: замедляет игроков (меньше астероидов для добычи).
upg-asteroids-percent=100 — без изменений. 50 — вдвое меньше.
upg-asteroids-cap=Когда у платформы больше астероидов, в каждом проходе убираются самые дальние от хаба. Сами платформы не трогаются. См. также /upg platforms Влияние на игру: чуть замедляет игроков при низком пределе.
upg-build-queue-tune=Снижает, сколько призраков строительные роботы каждой фракции пытаются построить за тик. Стройка чуть медленнее, большие чертежи обходятся дешевле. Старое значение вернётся при выключении. Влияние на игру: замедляет игроков.
upg-build-queue-percent=100 — без изменений. 67 — две трети.
upg-player-messages=Выключите, чтобы не видеть сообщения UPS Guard только у себя. То же, что /upg messages off.

