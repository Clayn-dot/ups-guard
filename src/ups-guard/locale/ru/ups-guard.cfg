[mod-name]
ups-guard=UPS Guard

[mod-description]
ups-guard=Держит тяжёлую сетевую игру быстрой. Выберите уровень эффекта, и раз в несколько часов мод тихо убирает то, на что игра тратит силы впустую: предметы на земле, далёкую пустую карту, ненужные планеты и вражеские базы, рядом с которыми никого нет. Без подвисаний и настройки.

