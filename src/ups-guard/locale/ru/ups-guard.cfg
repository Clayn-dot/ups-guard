status-level=Уровень: __1__ (отличается настроек: __2__). Значений игры под управлением мода: __3__.
status-removed=Убрано за всё время: мусор __1__, загрязнение __2__, астероиды __3__.
junk-none=В upq-junk-types нет разрешённых типов. Разрешены: fire, corpse, entity-ghost.
junk-dry=Было бы убрано мусора: __1__ __2__. Добавьте confirm, чтобы выполнить.
junk-done=Убрано мусора: __1__ __2__
pollution-line=  __1__: загрязнение __2__, пусто __3__ ч. Очищено: __4__ (выполнено: __5__). Добавьте confirm, чтобы выполнить.
platform-line=  __1__: астероидов __2__, предел __3__. Убрано: __4__ (выполнено: __5__). Добавьте confirm, чтобы выполнить.
trains-head=Поездов без пути: __1__
trains-line=  поезд __1__ на поверхности __2__, ждёт станцию __3__
profile-on=Профиль включён: в итоговой карточке прохода видно время по видам задач.
profile-off=Профиль выключен.
help-junk=/upq junk [поверхности] [confirm]: убрать огонь и обломки (типы из настройки мусора).
help-pollution=/upq pollution [поверхности] [confirm]: показать загрязнение, очистить на пустых планетах (или на названных).
help-platforms=/upq platforms [confirm]: астероиды у каждой платформы, убрать лишние сверх предела.
help-trains=/upq trains: поезда, которые не могут найти путь.
help-profile=/upq profile [on|off]: показывать время по задачам в карточке прохода.
help-short=UPS Guard. /upq help покажет подкоманды.
help-header=Команды UPS Guard. К тем, что что-то удаляют, добавьте слово confirm; без него они только считают.
help-status=/upq status: счётчики, время до прохода, число врагов.
help-surfaces=/upq surfaces: поверхности с числом чанков и врагов.
help-config=/upq config [текст]: показать настройки (все или те, где есть текст).
help-messages=/upq messages [on|off]: показать или скрыть сообщения мода в чате у вас.
help-help=/upq help: этот список.
help-set=/upq set <настройка> <значение>: изменить настройку. Для списков: +имя добавляет, -имя убирает, - очищает.
help-reset=/upq reset <настройка>: вернуть одну настройку к умолчанию.
help-preset=/upq preset [имя]: применить набор настроек. Без имени покажет список.
help-cycle=/upq cycle: запустить проход обслуживания сейчас.
help-abort=/upq abort: отменить идущий проход и очередь задач.
help-report=/upq report: записать отчёт по сущностям в script-output/ups-guard-report.txt.
help-clean=/upq clean [поверхности] [confirm]: убрать предметы с земли.
help-sweep=/upq sweep: убрать застрявших юнитов по префиксам прямо сейчас.
help-trim=/upq trim <поверхность> [запас] [confirm]: удалить дальние пустые чанки.
help-freeze=/upq freeze [поверхности]: пересчитать зоны паузы сейчас.
help-thin=/upq thin [поверхности] confirm: удалить базы врагов дальше радиуса прореживания.
help-enemies=/upq enemies artillery|near <клетки>|reset <гнёзда> [поверхности] [confirm]: массовая зачистка врагов.
help-surface=/upq surface delete <имя> [confirm] | unused: удалить поверхность или показать простаивающие планеты.
